name: Label Copilot-reviewed PRs

on:
  pull_request_review:
    types:
      - submitted
      - edited

permissions:
  pull-requests: read
  issues: write

jobs:
  label:
    if: contains(github.event.review.user.login, 'copilot')
    runs-on: ubuntu-latest

    steps:
      - name: Add ai-assisted label if missing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          if gh api \
            "repos/${GH_REPO}/issues/${PR_NUMBER}/labels" \
            --jq '.[].name' |
            grep -Fxq 'ai-assisted'; then
            echo "Label already exists"
            exit 0
          fi

          gh api \
            --method POST \
            "repos/${GH_REPO}/issues/${PR_NUMBER}/labels" \
            -f 'labels[]=ai-assisted'
